base_output_dir: /data1/hai/unet/Multi-Purpose-Architecture-Unet/runs
run_name: '*test*'
class_names:
- Background
- Vegetation
- Building
- Road
- Water
- Unlabeled
model:
    name: GeminiUNetV2
    params:
        in_channels: 25
        num_classes: 6
        initial_filters: 64
        encoder_depth: 5
        enc_conv_filter_size: 3
        dilation_rate: 1
        pooling: Max
        conv_type: Normal
        bilinear: false
        sac_params:
            use_sea: true
data:
    dir: /data1/hai/unet/Multi-Purpose-Architecture-Unet/dataset_40_for_test
    normalization: z-score
    patch_size:
    - 208
    - 400
optimizer:
    name: AdamW
    params:
        lr: 0.0001
        weight_decay: 0.0001
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 300
loss:
    name: DiceLoss
    params:
        alpha: 0.4
        beta: 0.6
training:
    batch_size: 8
    num_epochs: 1
    verbose: 1
    workers: 4
    early_stopping:
        enabled: true
        monitor: val_loss
        min_delta: 0.0001
        patience: 80
        mode: min
        verbose: 1

augmentation:
    use_augmentation: true
base_output_dir: ./training_runs
data:
    class_mapping:
        0: 4
        1: 0
        2: 1
        3: 2
        4: 4
        5: 3
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    dir: Image_dataset/cubes_fl32/Cubes_Scaling/
    file_extension: mat
    normalization: min-max
    patching:
        patch_size: 224
        stride: 192
        use_patching: true
    seed: 42
loss:
    name: CombinedLoss
    params:
        alpha: 0.4
        beta: 0.6
model:
    class_names:
    - Road
    - RoadLine
    - Vegetation
    - Sky
    - NoDrivable
    name: SpectralFormer_Seg
    params:
        image_size: 224
        patch_size: 16
        in_channels: 25
        num_classes: 5
        dim: 512
        depth: 12
        heads: 16
        mlp_dim: 2048
        dim_head: 32
        dropout: 0.1
        emb_dropout: 0.1
optimizer:
    name: AdamW
    params:
        lr: 0.00005
        weight_decay: 0.0001
run_name: Exp_SF_Huge_P16
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 400
        eta_min: 1.0e-07
training:
    batch_size: 8
    early_stopping_patience: 80
    num_epochs: 400
    use_amp: true

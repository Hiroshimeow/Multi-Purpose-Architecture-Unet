augmentation:
    random_brightness_contrast:
        p: 0.5
    shift_scale_rotate:
        p: 0.5
        rotate_limit: 15
        scale_limit: 0.1
        shift_limit: 0.0625
    use_augmentation: true
base_output_dir: ./training_runs_reproduce
data:
    class_mapping:
        0: 4
        1: 0
        2: 1
        3: 2
        4: 4
        5: 3
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    dir: ../Image_dataset/cubes_fl32/
    file_extension: mat
    normalization: min-max
    patching:
        patch_size: 224
        stride: 192
        use_patching: true
    seed: 25873
loss:
    name: CombinedLoss
    params:
        alpha: 0.4
        beta: 0.6
model:
    class_names:
    - Road
    - RoadLine
    - Vegetation
    - Sky
    - NoDrivable
    name: SpectralFormer_Seg
    params:
        depth: 3
        dim: 64
        dim_head: 16
        dropout: 0.1
        emb_dropout: 0.1
        heads: 4
        image_size: 224
        in_channels: 25
        mlp_dim: 128
        num_classes: 5
        num_selected_bands: 5
        patch_size: 16
optimizer:
    name: AdamW
    params:
        lr: 0.0005
        weight_decay: 0.0001
run_name: SF_S25873_TABS_k5_Tiny
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 400
        eta_min: 1.0e-06
training:
    batch_size: 8
    early_stopping_patience: 50
    num_epochs: 400
    use_amp: true

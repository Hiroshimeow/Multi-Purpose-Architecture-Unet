run_name: GeminiUNetV2_run12_band_compression_decompression_v1
base_output_dir: ./training_runs
class_names:
- Road
- RoadLine
- Vegetation
- Sky
- NoDrivable
data:
    dir: Image_dataset
    normalization: z-score
    class_mapping:
        1: 0
        2: 1
        3: 2
        5: 3
        0: 4
        4: 4
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    patching:
        patch_size: 224
        stride: 192
augmentation:
    shift_scale_rotate:
        p: 0.5
        shift_limit: 0.0625
        scale_limit: 0.1
        rotate_limit: 15
    random_brightness_contrast:
        p: 0.5
model:
    name: GeminiUNetV2
    params:
        in_channels: 25
        num_classes: 5
        initial_filters: 32
        depth: 4
        dropout_rate: 0.2
        bilinear: false
        use_bcd: true
        bcd_intermediate_channels: 3
        sac_params: null
loss:
    name: CombinedLoss
    params:
        alpha: 0.2
        beta: 0.8
training:
    num_epochs: 30
    batch_size: 16
    use_amp: true
    early_stopping_patience: 10
optimizer:
    name: AdamW
    params:
        lr: 0.001
        weight_decay: 0.0001
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 30
        eta_min: 1.0e-06

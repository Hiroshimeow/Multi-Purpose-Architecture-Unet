run_name: GeminiUNetV2_run16_smaller_model
base_output_dir: ./training_runs
class_names:
- Road
- RoadLine
- Vegetation
- Sky
- NoDrivable
data:
    dir: Image_dataset_pca_5band
    normalization: z-score
    class_mapping:
        1: 0
        2: 1
        3: 2
        5: 3
        0: 4
        4: 4
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    patching:
        patch_size: 224
        stride: 192
augmentation:
    shift_scale_rotate:
        p: 0.5
        shift_limit: 0.0625
        scale_limit: 0.1
        rotate_limit: 15
    random_brightness_contrast:
        p: 0.5
model:
    name: GeminiUNetV2
    params:
        in_channels: 5
        num_classes: 5
        initial_filters: 12
        depth: 4
        dropout_rate: 0.2
        bilinear: false
        use_boundary_head: true
        sac_params:
            reduced_depth: 3
            channels: 12
            use_sea: true
loss:
    name: BoundaryLoss
    params:
        boundary_weight: 0.5
        main_loss_params:
            name: CombinedLoss
            params:
                alpha: 0.4
                beta: 0.6
        boundary_loss_params:
            name: DiceLoss
            params: {}
training:
    num_epochs: 140
    batch_size: 16
    use_amp: true
    early_stopping_patience: 15
optimizer:
    name: AdamW
    params:
        lr: 0.001
        weight_decay: 0.0001
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 140
        eta_min: 1.0e-06

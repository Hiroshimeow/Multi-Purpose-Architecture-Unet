base_output_dir: training_runs
log_file: cbsfnet_5_channels.log
model:
    name: CB_SFNet
    class_names:
    - Road
    - RoadLine
    - NoDrivable
    - Vegetation
    - Sky
    params:
        in_channels: 5
        num_classes: 5
        base_filters: 16
        bilinear: false
data:
    dir: Image_dataset_pca_5band
    class_mapping:
        1: 0
        2: 1
        3: 2
        5: 3
        0: 4
        4: 4
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    file_extension: mat
    val_split: 0.2
    normalization: z_score
    patching:
        patch_size: 256
        stride: 192
training:
    num_epochs: 1
    batch_size: 32
    early_stopping_patience: 50
    augmentations:
        HorizontalFlip:
            p: 0.5
        RandomRotate90:
            p: 0.5
        ShiftScaleRotate:
            p: 0.5
            shift_limit: 0.0625
            scale_limit: 0.1
            rotate_limit: 15
        RandomBrightnessContrast:
            p: 0.5
            brightness_limit: 0.2
            contrast_limit: 0.2
        ElasticTransform:
            p: 0.2
        GaussNoise:
            p: 0.2
run_name: CB_SFNet_complex_model_base16_5_channels
optimizer:
    name: Adam
    params:
        lr: 0.001
loss:
    name: CBSFNetLoss
    params:
        alpha: 0.4
        beta: 0.6
scheduler:
    name: ReduceLROnPlateau
    params:
        mode: min
        factor: 0.1
        patience: 5
early_stopping:
    patience: 50

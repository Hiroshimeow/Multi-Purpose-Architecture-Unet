run_name: ASRAN_correlation_p224_s192_small
base_output_dir: ./training_runs
data:
    dir: Image_dataset_correlation_5_bands
    file_extension: mat
    normalization: min-max
    class_mapping:
        1: 0
        2: 1
        3: 2
        5: 3
        0: 4
        4: 4
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    patching:
        use_patching: true
        patch_size: 224
        stride: 192
augmentation:
    use_augmentation: true
model:
    name: StandardUNet
    class_names:
    - Road
    - RoadLine
    - Vegetation
    - Sky
    - NoDrivable
    params:
        in_channels: 5
        num_classes: 5
        base_filters: 6
        use_sa: true
loss:
    name: CombinedLoss
    params:
        alpha: 0.4
        beta: 0.6
training:
    num_epochs: 400
    batch_size: 16
    use_amp: true
    early_stopping_patience: 80
optimizer:
    name: AdamW
    params:
        lr: 0.001
        weight_decay: 0.0001
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 400
        eta_min: 1.0e-06

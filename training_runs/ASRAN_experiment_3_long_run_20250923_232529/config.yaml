run_name: ASRAN_experiment_3_long_run
base_output_dir: ./training_runs
class_names:
- Road
- RoadLine
- Vegetation
- Sky
- NoDrivable
data:
    dir: Image_dataset_pca_3band
    normalization: min-max
    class_mapping:
        1: 0
        2: 1
        3: 2
        5: 3
        0: 4
        4: 4
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    patching:
        patch_size: 224
        stride: 192
augmentation:
    shift_scale_rotate:
        p: 0.5
        shift_limit: 0.0625
        scale_limit: 0.1
        rotate_limit: 15
    random_brightness_contrast:
        p: 0.5
model:
    name: ASRAN
    params:
        in_channels: 3
        reconstructed_channels: 25
        num_classes: 5
        base_filters: 64
loss:
    name: CombinedLoss
    params:
        alpha: 0.4
        beta: 0.6
training:
    num_epochs: 150
    batch_size: 4
    use_amp: true
    early_stopping_patience: 10
optimizer:
    name: AdamW
    params:
        lr: 0.001
        weight_decay: 0.0001
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 150
        eta_min: 1.0e-06

augmentation:
    use_augmentation: true
base_output_dir: ./training_runs
data:
    class_mapping:
        0: 4
        1: 0
        2: 1
        3: 2
        4: 4
        5: 3
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    dir: Image_dataset
    file_extension: mat
    normalization: min-max
    patching:
        patch_size: 224
        stride: 192
        use_patching: true
    seed: 832614
loss:
    name: CombinedLoss
    params:
        alpha: 0.4
        beta: 0.6
model:
    class_names:
    - Road
    - RoadLine
    - Vegetation
    - Sky
    - NoDrivable
    name: StandardUNet
    params:
        base_filters: 6
        in_channels: 5
        num_classes: 5
        num_select_bands: 5
        selected_bands_indices:
        - 4
        - 13
        - 14
        - 17
        - 18
        use_asa: true
optimizer:
    name: AdamW
    params:
        lr: 0.001
        weight_decay: 0.0001
run_name: Exp_SVM-RFE_k5_s832614
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 400
        eta_min: 1.0e-06
training:
    batch_size: 16
    early_stopping_patience: 80
    num_epochs: 400
    use_amp: true

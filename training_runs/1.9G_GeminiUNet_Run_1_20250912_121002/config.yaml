run_name: GeminiUNet_Run_1
base_output_dir: ./training_runs
class_names:
- Road
- RoadLine
- Vegetation
- Sky
- NoDrivable
data:
    dir: ./dataset_40_for_test
    normalization: z-score
    class_mapping:
        1: 0
        2: 1
        3: 2
        5: 3
        0: 4
        4: 4
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    patching:
        patch_size: 224
        overlap: 32
        stride: 192
model:
    name: GeminiUNet
    params:
        in_channels: 25
        num_classes: 5
        initial_filters: 64
        depth: 5
        dropout_rate: 0.3
loss:
    name: GeminiCombinedLoss
    params:
        focal_w: 0.4
        dice_w: 0.6
        ds_weights:
        - 0.4
        - 0.2
training:
    num_epochs: 50
    batch_size: 8
    use_amp: true
    early_stopping_patience: 5
optimizer:
    name: AdamW
    params:
        lr: 0.0003
        weight_decay: 1.0e-05
scheduler:
    name: CosineAnnealingWarmRestarts
    params:
        T_0: 15
        T_mult: 2
        eta_min: 1.0e-06

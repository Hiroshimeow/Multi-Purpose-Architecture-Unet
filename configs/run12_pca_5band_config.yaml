# configs/run12_pca_5band_config.yaml
# Experiment with 5-band data generated by PCA.

# --- Experiment Setup ---
run_name: 'GeminiUNetV2_run12_5band_from_pca'
base_output_dir: './training_runs'
class_names: ["Road", "RoadLine", "Vegetation", "Sky", "NoDrivable"]

# --- Data Handling ---
data:
  dir: "Image_dataset_pca_5band" # Changed to the new 5-band PCA dataset
  normalization: 'min-max' # Data is not normalized after PCA, so min-max is a safe choice
  class_mapping: {1: 0, 2: 1, 3: 2, 5: 3, 0: 4, 4: 4, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4}
  patching:
    patch_size: 224
    stride: 192

# --- Augmentation Settings ---
augmentation:
  shift_scale_rotate:
    p: 0.5
    shift_limit: 0.0625
    scale_limit: 0.1
    rotate_limit: 15
  random_brightness_contrast:
    p: 0.5

# --- Model Architecture ---
model:
  name: 'ASRAN'
  params:
    in_channels: 5
    num_classes: 5
    base_filters: 16
    reconstructed_channels: 25

# --- Loss Function ---
loss:
  name: 'CombinedLoss'
  params:
    alpha: 0.4
    beta: 0.6

# --- Training Process ---
training:
  num_epochs: 140
  batch_size: 16
  use_amp: True
  early_stopping_patience: 10

# --- Optimizer ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.0001

# --- Scheduler ---
scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max: 140
    eta_min: 0.000001

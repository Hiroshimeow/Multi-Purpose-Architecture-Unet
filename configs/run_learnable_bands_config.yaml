# configs/run_learnable_bands_config.yaml
# Experiment for Unet with Learnable Band Selection (25->5).

# --- Experiment Setup ---
run_name: 'LearnableBands_exp1_100e'
base_output_dir: './training_runs'
class_names: ["Road", "RoadLine", "Vegetation", "Sky", "NoDrivable"]

# --- Data Handling ---
data:
  dir: "Image_dataset" # Using original 25-band dataset
  normalization: 'min-max' 
  class_mapping: {1: 0, 2: 1, 3: 2, 5: 3, 0: 4, 4: 4, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4}
  patching:
    patch_size: 224
    stride: 192

# --- Augmentation Settings ---
augmentation:
  shift_scale_rotate:
    p: 0.5
    shift_limit: 0.0625
    scale_limit: 0.1
    rotate_limit: 15
  random_brightness_contrast:
    p: 0.5

# --- Model Architecture ---
model:
  name: 'UnetBandS'
  params:
    in_channels: 25
    num_selected_bands: 5
    num_classes: 5
    initial_filters: 32 # Using lightweight backbone
    bilinear: False # Use learnable transposed convolutions

# --- Loss Function ---
loss:
  name: 'CombinedLoss'
  params:
    alpha: 0.4 # Dice-focused loss
    beta: 0.6

# --- Training Process ---
training:
  num_epochs: 100
  batch_size: 16 # Can use a larger batch size for this simpler model
  use_amp: True
  early_stopping_patience: 30

# --- Optimizer ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.0001

# --- Scheduler ---
scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max: 100 # Match num_epochs
    eta_min: 0.000001

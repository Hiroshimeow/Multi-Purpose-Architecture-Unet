augmentation:
    random_brightness_contrast:
        p: 0.5
    shift_scale_rotate:
        p: 0.5
        rotate_limit: 15
        scale_limit: 0.1
        shift_limit: 0.0625
base_output_dir: ./training_runs
class_names:
- Road
- RoadLine
- Vegetation
- Sky
- NoDrivable
data:
    class_mapping:
        0: 4
        1: 0
        2: 1
        3: 2
        4: 4
        5: 3
        6: 4
        7: 4
        8: 4
        9: 4
        10: 4
    dir: Image_dataset
    normalization: min-max
    patching:
        patch_size: 224
        stride: 192
    seed: 25873
loss:
    name: CombinedLoss
    params:
        alpha: 0.0
        beta: 1.0
model:
    class_names:
    - Road
    - RoadLine
    - Vegetation
    - Sky
    - NoDrivable
    name: TABS
    params:
        bilinear: false
        in_channels: 25
        initial_filters: 6
        num_classes: 5
        num_selected_bands: 7
optimizer:
    name: AdamW
    params:
        lr: 0.001
        weight_decay: 0.0001
run_name: Ablation_Dice_Only_k7_s25873
scheduler:
    name: CosineAnnealingLR
    params:
        T_max: 400
        eta_min: 1.0e-06
training:
    batch_size: 8
    early_stopping_patience: 50
    num_epochs: 400
    use_amp: true

# configs/test_config.yaml
# File cấu hình tạm thời để thử nghiệm các kiến trúc model.

# --- Experiment Setup ---
run_name: 'temp_test_run'
base_output_dir: './training_runs'
class_names: ["Road", "RoadLine", "Vegetation", "Sky", "NoDrivable"]

# --- Data Handling ---
data:
  dir: "dataset_40_for_test" # <--- THAY ĐỔI QUAN TRỌNG
  normalization: 'z-score'
  class_mapping: {1: 0, 2: 1, 3: 2, 5: 3, 0: 4, 4: 4, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4}
  patching:
    patch_size: 224
    stride: 192

# --- Augmentation Settings ---
augmentation:
  shift_scale_rotate:
    p: 0.5
    shift_limit: 0.0625
    scale_limit: 0.1
    rotate_limit: 15
  random_brightness_contrast:
    p: 0.5

# --- Model Architecture ---
model:
  name: 'UnetCbam' # Sẽ bị ghi đè bởi tham số --model_name
  params:
    in_channels: 25
    num_classes: 5
    initial_filters: 32
    depth: 4
    dropout_rate: 0.2
    bilinear: False
    # Các params không dùng sẽ được bỏ qua bởi model
    sac_params:
      reduced_depth: 3
      channels: 32
      use_sea: True

# --- Loss Function ---
loss:
  name: 'CombinedLoss'
  params:
    alpha: 0.2
    beta: 0.8

# --- Training Process ---
training:
  num_epochs: 1 # Chỉ chạy 1 epoch
  batch_size: 4 # Batch size nhỏ để tránh lỗi OOM
  use_amp: True
  early_stopping_patience: 50

# --- Optimizer ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.0001

# --- Scheduler ---
scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max: 1
    eta_min: 0.000001

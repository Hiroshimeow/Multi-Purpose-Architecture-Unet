# configs/run_asran_pca5_config.yaml
# Experiment for ASRAN on 5-band PCA data.

# --- Experiment Setup ---
run_name: 'ASRAN_exp4_pca5_100e'
base_output_dir: './training_runs'
class_names: ["Road", "RoadLine", "Vegetation", "Sky", "NoDrivable"]

# --- Data Handling ---
data:
  dir: "Image_dataset_pca_5band" # Using 5-band PCA data
  normalization: 'min-max' 
  class_mapping: {1: 0, 2: 1, 3: 2, 5: 3, 0: 4, 4: 4, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4}
  patching:
    patch_size: 224
    stride: 192

# --- Augmentation Settings ---
augmentation:
  shift_scale_rotate:
    p: 0.5
    shift_limit: 0.0625
    scale_limit: 0.1
    rotate_limit: 15
  random_brightness_contrast:
    p: 0.5

# --- Model Architecture ---
model:
  name: 'ASRAN'
  params:
    in_channels: 5 # Input is 5 channels from PCA
    reconstructed_channels: 25
    num_classes: 5
    base_filters: 64

# --- Loss Function ---
loss:
  name: 'CombinedLoss'
  params:
    alpha: 0.4 # Dice-focused loss
    beta: 0.6

# --- Training Process ---
training:
  num_epochs: 100
  batch_size: 4 # Keep batch size small due to model size
  use_amp: True
  early_stopping_patience: 30

# --- Optimizer ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.0001

# --- Scheduler ---
scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max: 100 # Match num_epochs
    eta_min: 0.000001

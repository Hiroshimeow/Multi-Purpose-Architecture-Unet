# configs/gemini_config.yaml
# Configuration file for the Gemini-enhanced UNet model.

# --- Experiment Setup ---
run_name: 'GeminiUNet_Run_1'
base_output_dir: './training_runs'
class_names: ["Road", "RoadLine", "Vegetation", "Sky", "NoDrivable"]

# --- Data Handling ---
data:
  dir: './dataset_40_for_test'
  # Use z-score normalization based on the training set
  normalization: 'z-score' 
  # Class mapping to 5 classes as defined in the high-IoU script
  class_mapping: {1: 0, 2: 1, 3: 2, 5: 3, 0: 4, 4: 4, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4}
  # Patching configuration expected by TiledHyperspectralDataset
  patching:
    patch_size: 224
    overlap: 32
    stride: 192

# --- Model Architecture ---
model:
  name: 'GeminiUNet' # Use the new model
  params:
    in_channels: 25
    num_classes: 5
    initial_filters: 64 # Optimized for powerful GPUs
    depth: 5
    dropout_rate: 0.3

# --- Loss Function ---
loss:
  name: 'GeminiCombinedLoss' # Use the new loss
  params:
    focal_w: 0.4
    dice_w: 0.6
    # Weights for the 2 deep supervision outputs
    ds_weights: [0.4, 0.2]

# --- Training Process ---
training:
  num_epochs: 50
  batch_size: 8 # Optimized for powerful GPUs
  # Use AMP for faster training
  use_amp: True 
  early_stopping_patience: 5 

# --- Optimizer ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.0003
    weight_decay: 0.00001

# --- Scheduler ---
scheduler:
  name: 'CosineAnnealingWarmRestarts'
  params:
    T_0: 15 # Number of iterations for the first restart
    T_mult: 2 # A factor to increase T_i after a restart
    eta_min: 0.000001

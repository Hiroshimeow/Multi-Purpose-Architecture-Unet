augmentation:
  use_augmentation: true
base_output_dir: ./training_runs
data:
  class_mapping:
    0: 4
    1: 0
    2: 1
    3: 2
    4: 4
    5: 3
    6: 4
    7: 4
    8: 4
    9: 4
    10: 4
  dir: Image_dataset
  file_extension: mat
  normalization: min-max
  patching:
    patch_size: 224
    stride: 192
    use_patching: true
  seed: 56036
loss:
  name: CombinedLoss
  params:
    alpha: 0.4
    beta: 0.6
model:
  class_names:
  - Road
  - RoadLine
  - Vegetation
  - Sky
  - NoDrivable
  name: TABS
  params:
    bilinear: true
    depth: 4
    in_channels: 25
    initial_filters: 9
    num_classes: 5
    num_selected_bands: 5
optimizer:
  name: AdamW
  params:
    lr: 0.001
    weight_decay: 0.0001
run_name: Exp_TABS_k5_s56036
scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 400
    eta_min: 1.0e-06
training:
  batch_size: 16
  early_stopping_patience: 80
  num_epochs: 400
  use_amp: true

# configs/run10_3band_config.yaml
# Experiment with 3-band data generated by an autoencoder.

# --- Experiment Setup ---
run_name: 'GeminiUNetV2_run10_3band_from_autoencoder'
base_output_dir: './training_runs'
class_names: ["Road", "RoadLine", "Vegetation", "Sky", "NoDrivable"]

# --- Data Handling ---
data:
  dir: "Image_dataset_3band" # Changed to the new 3-band dataset
  normalization: 'min-max' # Use min-max as the data is already normalized by the autoencoder
  class_mapping: {1: 0, 2: 1, 3: 2, 5: 3, 0: 4, 4: 4, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4}
  patching:
    patch_size: 224
    stride: 192

# --- Augmentation Settings ---
augmentation:
  shift_scale_rotate:
    p: 0.5
    shift_limit: 0.0625
    scale_limit: 0.1
    rotate_limit: 15
  random_brightness_contrast:
    p: 0.5

# --- Model Architecture ---
model:
  name: 'GeminiUNetV2'
  params:
    in_channels: 3 # Changed from 25 to 3
    num_classes: 5
    initial_filters: 32
    depth: 4
    dropout_rate: 0.2
    bilinear: False
    sac_params:
      reduced_depth: 3
      channels: 32
      use_sea: True

# --- Loss Function ---
loss:
  name: 'CombinedLoss'
  params:
    alpha: 0.4 # Using the same weights as the successful run9
    beta: 0.6

# --- Training Process ---
training:
  num_epochs: 140
  batch_size: 16
  use_amp: True
  early_stopping_patience: 10

# --- Optimizer ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.0001

# --- Scheduler ---
scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max: 140
    eta_min: 0.000001

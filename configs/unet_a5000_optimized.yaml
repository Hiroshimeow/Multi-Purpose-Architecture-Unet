# configs/unet_a5000_optimized.yaml

# --- Run & Environment ---
run_name: "unet_A5000_bs32_bf64" # Tên rõ ràng thể hiện các tham số chính
base_output_dir: "training_runs"
class_names: ["Road (tarmac)", "Road marks", "Painted metal", "Sky", "Concrete/stone/brick"]

# --- Model & Architecture ---
model:
  name: "UNet"
  params:
    in_channels: 25
    num_classes: 5
    bilinear: True
    base_filters: 64 # TĂNG: Sử dụng U-Net tiêu chuẩn, mạnh mẽ hơn

# --- Data & Patching Strategy ---
data:
  dir: "Image_dataset"
  # dir: "dataset_40_for_test"
  patching:
    patch_size: 512 # Giữ nguyên patch_size, ưu tiên tăng batch_size
    stride: 256
  class_mapping: {1: 0, 2: 1, 4: 2, 5: 3, 6: 4, 0: 0, 3: 2, 7: 2, 9: 2, 10: 4}

# --- Augmentation ---
augmentation:
  elastic_transform:
    p: 0.5
    alpha: 120
    sigma: 6
    alpha_affine: 25

# --- Training ---
training:
  batch_size: 16 # TĂNG ĐÁNG KỂ: Tận dụng 24GB VRAM
  num_epochs: 150
  early_stopping_patience: 25

# --- Optimizer & Scheduler ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.0002 # TĂNG NHẸ: Với batch_size lớn hơn, có thể dùng LR cao hơn một chút
    weight_decay: 0.0001
scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max_epochs_offset: 0
    eta_min: 0.000001

# --- Loss Function ---
loss:
  name: 'WeightedCombinedLoss'
  boundary_weight:
    w0: 10.0
    sigma: 5.0
  params:
    alpha: 1.0
    beta: 0.5
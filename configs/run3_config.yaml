# configs/run3_config.yaml
# Configuration for the GeminiUNetV2 model.

# --- Experiment Setup ---
run_name: 'GeminiUNetV2_run1'
base_output_dir: './training_runs'
class_names: ["Road", "RoadLine", "Vegetation", "Sky", "NoDrivable"]

# --- Data Handling ---
data:
  dir: './dataset_40_for_test'
  normalization: 'z-score'
  class_mapping: {1: 0, 2: 1, 3: 2, 5: 3, 0: 4, 4: 4, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4}
  patching:
    patch_size: 224
    stride: 192

# --- Model Architecture ---
model:
  name: 'GeminiUNetV2'
  params:
    in_channels: 25
    num_classes: 5
    initial_filters: 32
    depth: 4
    dropout_rate: 0.2
    bilinear: True
    sac_params:
      reduced_depth: 3
      channels: 32
      use_sea: True

# --- Loss Function ---
loss:
  name: 'CombinedLoss'
  params:
    alpha: 0.6
    beta: 0.4

# --- Training Process ---
training:
  num_epochs: 40
  batch_size: 16
  use_amp: True
  early_stopping_patience: 7

# --- Optimizer ---
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.0001

# --- Scheduler ---
scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max: 40
    eta_min: 0.000001

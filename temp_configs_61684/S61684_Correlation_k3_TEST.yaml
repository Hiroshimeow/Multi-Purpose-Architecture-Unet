augmentation:
  random_brightness_contrast:
    p: 0.5
  shift_scale_rotate:
    p: 0.5
    rotate_limit: 15
    scale_limit: 0.1
    shift_limit: 0.0625
base_output_dir: ./training_runs
class_names:
- Road
- RoadLine
- Vegetation
- Sky
- NoDrivable
data:
  class_mapping:
    0: 4
    1: 0
    2: 1
    3: 2
    4: 4
    5: 3
    6: 4
    7: 4
    8: 4
    9: 4
    10: 4
  dir: Image_dataset
  normalization: min-max
  patching:
    patch_size: 224
    stride: 192
  seed: 61684
  test_split: 0.2
  val_split: 0.2
loss:
  name: CombinedLoss
  params:
    alpha: 0.4
    beta: 0.6
model:
  class_names:
  - Road
  - RoadLine
  - Vegetation
  - Sky
  - NoDrivable
  name: StandardUNet
  params:
    bilinear: false
    in_channels: 3
    initial_filters: 6
    num_classes: 5
    selected_bands_indices:
    - 6
    - 7
    - 11
optimizer:
  name: AdamW
  params:
    lr: 0.001
    weight_decay: 0.0001
run_name: S61684_Correlation_k3_TEST
scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 2
    eta_min: 1.0e-06
training:
  batch_size: 8
  early_stopping_patience: 50
  num_epochs: 2
  use_amp: true
